<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLVCKTORQUE — YouTube Shorts Multi-Stream Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="top-nav">
      <div class="brand" id="brand-home" title="Reset to BLVCKTORQUE">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <span class="brand-name">Shorts<b>Matrix</b></span>
      </div>

      <!-- Channel Search / Loader -->
      <form id="channel-form" class="search-form">
        <div class="input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="channel-input" 
            placeholder="Paste channel URL, studio link, @handle, or ID..." 
            autocomplete="off" 
            spellcheck="false"
          />
          <button type="submit" id="load-btn" aria-label="Load channel">
            <span>Load</span>
          </button>
        </div>
      </form>

      <!-- Multi-Player Grid Toggle (1, 4, 8, 12, 16, 24) -->
      <div class="grid-controls">
        <span class="grid-label">Players:</span>
        <div class="grid-pill-group" id="grid-toggle-group">
          <button class="grid-pill" data-count="1">1</button>
          <button class="grid-pill active" data-count="4">4</button>
          <button class="grid-pill" data-count="8">8</button>
          <button class="grid-pill" data-count="12">12</button>
          <button class="grid-pill" data-count="16">16</button>
          <button class="grid-pill" data-count="24">24</button>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="top-actions">
        <button id="randomize-all-btn" class="icon-btn-highlight" title="Randomize All Videos" aria-label="Randomize Videos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>Shuffle All</span>
        </button>

        <button id="sync-btn" class="icon-btn" title="Sync Channel Feed" aria-label="Sync Feed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>

        <button id="audio-info-btn" class="icon-btn" title="Audio Status" aria-label="Audio Status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Channel Selector Chips -->
    <div class="preset-channels" id="preset-channels">
      <span class="preset-label">Channel:</span>
      <button class="chip active featured-chip" data-channel="UCc3WaSgyMJ4q1orDuTla1BA">🔥 BLVCKTORQUE (Active)</button>
      <button class="chip" data-channel="@veritasium">Veritasium</button>
      <button class="chip" data-channel="@mkbhd">MKBHD</button>
      <button class="chip" data-channel="@ZachKing">Zach King</button>
      <button class="chip" data-channel="@MrBeast">MrBeast</button>
      <div class="channel-stats">
        <span class="live-dot"></span>
        <span id="active-channel-name">BLVCKTORQUE</span> • 
        <span id="pool-count">15 Shorts in library</span>
      </div>
    </div>

    <!-- Multi-Stream Grid Wall -->
    <main class="grid-stage">
      <div class="shorts-matrix grid-4" id="shorts-matrix">
        <!-- Dynamic Player Cards will be rendered here -->
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Randomized all shorts!</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
